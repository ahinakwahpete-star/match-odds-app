<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match Odds Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #E3D5B0; }
  #root { min-height: 100vh; }
  #fallback { font-family: monospace; padding: 24px; color: #24211B; }
</style>
</head>
<body>
<div id="root"><div id="fallback">Loading Match Odds Lab…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
window.addEventListener("error", function (e) {
  var f = document.getElementById("fallback");
  if (f) f.textContent = "Something broke: " + e.message;
});
</script>
<script>
const { useState, useMemo } = React;

function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function poissonPMF(k, lambda) {
  return Math.exp(-lambda) * Math.pow(lambda, k) / factorial(k);
}

const PAPER = "#EFE6CF";
const PAPER_DEEP = "#E3D5B0";
const INK = "#24211B";
const STAMP = "#A5332B";
const TEAL = "#3C6E64";
const LINE = "#B8A88A";
const HOME_ADV = 1.15;
const AWAY_ADV = 0.9;
const PROXY_BASE = "https://football-proxy-sepia.vercel.app/api/football";

async function fetchTeamForm(teamName) {
  const searchRes = await fetch(PROXY_BASE + "?endpoint=teams&search=" + encodeURIComponent(teamName));
  if (!searchRes.ok) throw new Error("Proxy request failed");
  const searchData = await searchRes.json();
  const team = searchData && searchData.response && searchData.response[0] && searchData.response[0].team;
  if (!team) throw new Error("Team not found");
  const currentYear = new Date().getFullYear();
  const seasonsToTry = [currentYear, currentYear - 1, currentYear - 2, currentYear - 3];
  let finished = [];
  for (const season of seasonsToTry) {
    const fixturesRes = await fetch(PROXY_BASE + "?endpoint=fixtures&team=" + team.id + "&season=" + season);
    if (!fixturesRes.ok) continue;
    const fixturesData = await fixturesRes.json();
    const fixtures = (fixturesData && fixturesData.response) || [];
    const seasonFinished = fixtures.filter(function (f) {
      return f.fixture && f.fixture.status && f.fixture.status.short === "FT" && f.fixture.date;
    });
    finished = finished.concat(seasonFinished);
    if (finished.length >= 10) break;
  }
  if (finished.length === 0) throw new Error("No finished fixtures found for this team");
  finished.sort(function (a, b) { return new Date(b.fixture.date) - new Date(a.fixture.date); });
  const recent = finished.slice(0, 10);
  let scoredTotal = 0, concededTotal = 0, weightTotal = 0, count = 0;
  recent.forEach(function (f, i) {
    const w = Math.pow(0.9, i); // i = 0 is the newest game
    const isHome = f.teams && f.teams.home && f.teams.home.id === team.id;
    const gf = isHome ? (f.goals && f.goals.home) : (f.goals && f.goals.away);
    const ga = isHome ? (f.goals && f.goals.away) : (f.goals && f.goals.home);
    if (gf != null && ga != null) {
      scoredTotal += gf * w;
      concededTotal += ga * w;
      weightTotal += w;
      count++;
    }
  });
  if (count === 0) throw new Error("No usable score data found");
  return {
    scored: +(scoredTotal / weightTotal).toFixed(2),
    conceded: +(concededTotal / weightTotal).toFixed(2),
    fullName: team.name,
    gamesUsed: count
  };
}

const h = React.createElement;

function CouponPredictor() {
  const [homeName, setHomeName] = useState("HOME");
  const [awayName, setAwayName] = useState("AWAY");
  const [homeScored, setHomeScored] = useState(1.7);
  const [homeConceded, setHomeConceded] = useState(1.1);
  const [awayScored, setAwayScored] = useState(1.3);
  const [awayConceded, setAwayConceded] = useState(1.4);
  const [neutral, setNeutral] = useState(false);
  const [calcKey, setCalcKey] = useState(1);
  const [shown, setShown] = useState(true);
  const [homeFetch, setHomeFetch] = useState({ loading: false, error: null, note: null });
  const [awayFetch, setAwayFetch] = useState({ loading: false, error: null, note: null });

  async function pullRealStats(side) {
    const name = side === "home" ? homeName : awayName;
    const setFetchState = side === "home" ? setHomeFetch : setAwayFetch;
    const setScored = side === "home" ? setHomeScored : setAwayScored;
    const setConceded = side === "home" ? setHomeConceded : setAwayConceded;
    setFetchState({ loading: true, error: null, note: null });
    try {
      const result = await fetchTeamForm(name);
      setScored(result.scored);
      setConceded(result.conceded);
      setFetchState({ loading: false, error: null, note: result.fullName + ": last " + result.gamesUsed + " games" });
    } catch (e) {
      setFetchState({ loading: false, error: e.message, note: null });
    }
  }

  const xg = useMemo(function () {
    const rawHome = (homeScored + awayConceded) / 2;
    const rawAway = (awayScored + homeConceded) / 2;
    const hAdv = neutral ? 1 : HOME_ADV;
    const aAdv = neutral ? 1 : AWAY_ADV;
    return {
      homeXG: Math.min(6, Math.max(0.1, rawHome * hAdv)),
      awayXG: Math.min(6, Math.max(0.1, rawAway * aAdv))
    };
  }, [homeScored, homeConceded, awayScored, awayConceded, neutral]);
  const homeXG = xg.homeXG, awayXG = xg.awayXG;

  const stats = useMemo(function () {
    const N = 12;
    let homeWin = 0, draw = 0, awayWin = 0, over25 = 0, bttsYes = 0;
    let best = { i: 0, j: 0, p: 0 };
    const full = [];
    for (let i = 0; i < N; i++) {
      full.push([]);
      const pi = poissonPMF(i, homeXG);
      for (let j = 0; j < N; j++) {
        const p = pi * poissonPMF(j, awayXG);
        full[i].push(p);
        if (i > j) homeWin += p;
        else if (i === j) draw += p;
        else awayWin += p;
        if (i + j > 2) over25 += p;
        if (i > 0 && j > 0) bttsYes += p;
        if (p > best.p) best = { i: i, j: j, p: p };
      }
    }
    const DISP = 6;
    const grid = [];
    let maxCell = 0;
    for (let i = 0; i <= DISP; i++) {
      grid.push([]);
      for (let j = 0; j <= DISP; j++) {
        let p;
        if (i < DISP && j < DISP) p = full[i][j];
        else if (i === DISP && j < DISP) {
          p = 0;
          for (let x = DISP; x < N; x++) p += full[x][j];
        } else if (j === DISP && i < DISP) {
          p = 0;
          for (let y = DISP; y < N; y++) p += full[i][y];
        } else {
          p = 0;
          for (let x = DISP; x < N; x++) for (let y = DISP; y < N; y++) p += full[x][y];
        }
        grid[i].push(p);
        if (p > maxCell) maxCell = p;
      }
    }
    return { homeWin: homeWin, draw: draw, awayWin: awayWin, over25: over25, under25: 1 - over25, bttsYes: bttsYes, bttsNo: 1 - bttsYes, best: best, grid: grid, maxCell: maxCell };
  }, [homeXG, awayXG, calcKey]);

  const pct = function (x) { return (x * 100).toFixed(1) + "%"; };
  const outcomeMax = Math.max(stats.homeWin, stats.draw, stats.awayWin);
  const serialNo = useMemo(function () { return Math.floor(1e5 + Math.random() * 899999); }, [calcKey]);

  function runCalc() {
    setShown(false);
    setCalcKey(function (k) { return k + 1; });
    requestAnimationFrame(function () { requestAnimationFrame(function () { setShown(true); }); });
  }

  const css = "\n" +
    "* { box-sizing: border-box; }\n" +
    ".stamp-font { font-family: 'Special Elite', cursive; }\n" +
    "input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }\n" +
    ".flip-cell { animation: stampIn 0.4s ease both; }\n" +
    "@keyframes stampIn { from { opacity: 0; transform: scale(1.5); } to { opacity: 1; transform: scale(1); } }\n" +
    ".perf { background-image: radial-gradient(circle, " + PAPER_DEEP + " 3px, transparent 3.5px); background-size: 16px 16px; background-position: -8px center; height: 12px; }\n" +
    ".btn-punch { transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }\n" +
    ".btn-punch:hover { transform: translateY(-1px); }\n" +
    ".btn-punch:active { transform: translateY(1px) scale(0.98); }\n" +
    ".xg-btn:hover { background: " + INK + "; color: " + PAPER + "; }\n" +
    ".fetch-btn { transition: opacity 0.15s ease; cursor: pointer; }\n" +
    ".fetch-btn:disabled { opacity: 0.5; cursor: default; }\n" +
    ".neutral-toggle { transition: all 0.15s ease; cursor: pointer; }\n";

  const dispLabel = function (n) { return n === 6 ? "6+" : n; };

  return h("div", { style: { minHeight: "100vh", background: PAPER_DEEP, backgroundImage: "radial-gradient(circle at 20% 15%, rgba(0,0,0,0.03) 0, transparent 40%), radial-gradient(circle at 85% 80%, rgba(0,0,0,0.04) 0, transparent 45%)", color: INK, fontFamily: "'Courier Prime', monospace", padding: "32px 14px 64px" } },
    h("style", null, css),
    h("div", { style: { maxWidth: 720, margin: "0 auto", background: PAPER, border: "1px solid " + LINE, boxShadow: "0 2px 0 rgba(0,0,0,0.04), 0 12px 30px rgba(0,0,0,0.15)" } },
      h("div", { style: { padding: "26px 30px 16px", textAlign: "center" } },
        h("div", { style: { fontSize: 11, letterSpacing: "0.25em", color: TEAL, marginBottom: 6 } }, "No. ", serialNo, " \u00B7 POISSON FORECAST COUPON"),
        h("div", { className: "stamp-font", style: { fontSize: "clamp(28px, 6vw, 40px)", color: INK } }, "SCORELINE FORECAST"),
        h("div", { style: { fontSize: 12.5, color: "#5B5548", marginTop: 8, maxWidth: 460, marginLeft: "auto", marginRight: "auto" } }, "Type each team's name, tap \"Pull real stats\" to fetch their last 10 games from API-Football, or enter scored/conceded per game yourself.")
      ),
      h("div", { className: "perf" }),
      h("div", { style: { padding: "22px 30px" } },
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 14 } },
          h(TeamField, { label: "HOME", name: homeName, setName: setHomeName, scored: homeScored, setScored: setHomeScored, conceded: homeConceded, setConceded: setHomeConceded, fetchState: homeFetch, onFetch: function () { pullRealStats("home"); } }),
          h("div", { className: "stamp-font", style: { alignSelf: "center", fontSize: 20, color: STAMP } }, "v"),
          h(TeamField, { label: "AWAY", name: awayName, setName: setAwayName, scored: awayScored, setScored: setAwayScored, conceded: awayConceded, setConceded: setAwayConceded, fetchState: awayFetch, onFetch: function () { pullRealStats("away"); }, align: "right" })
        ),
        h("div", { style: { display: "flex", justifyContent: "center", marginTop: 18 } },
          h("button", { onClick: function () { setNeutral(function (n) { return !n; }); }, className: "neutral-toggle stamp-font", style: { background: neutral ? STAMP : "transparent", color: neutral ? PAPER : INK, border: "1px solid " + (neutral ? STAMP : LINE), borderRadius: 3, padding: "8px 18px", fontSize: 13, letterSpacing: "0.1em" } }, neutral ? "\u2713 NEUTRAL VENUE" : "PLAYED AT NEUTRAL VENUE?")
        ),
        h("div", { style: { textAlign: "center", fontSize: 10.5, color: "#8A8168", marginTop: 8 } }, "Model reads: ", homeName || "HOME", " ", homeXG.toFixed(2), " xG \u2014 ", awayName || "AWAY", " ", awayXG.toFixed(2), " xG", !neutral && " (home advantage applied)"),
        h("div", { style: { display: "flex", justifyContent: "center", marginTop: 18 } },
          h("button", { onClick: runCalc, className: "btn-punch stamp-font", style: { background: INK, color: PAPER, border: "none", padding: "12px 34px", fontSize: 16, letterSpacing: "0.1em" } }, "STAMP THE COUPON")
        )
      ),
      shown && h(React.Fragment, null,
        h("div", { className: "perf" }),
        h("div", { style: { padding: "20px 30px 4px" } },
          h(SectionLabel, null, "RESULT MARKET \u2014 1 X 2"),
          h("div", { style: { display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginTop: 10 } },
            h(ResultCell, { label: homeName || "HOME", value: stats.homeWin, pct: pct, isMax: stats.homeWin === outcomeMax, delay: 0 }),
            h(ResultCell, { label: "DRAW", value: stats.draw, pct: pct, isMax: stats.draw === outcomeMax, delay: 50 }),
            h(ResultCell, { label: awayName || "AWAY", value: stats.awayWin, pct: pct, isMax: stats.awayWin === outcomeMax, delay: 100 })
          )
        ),
        h("div", { style: { padding: "20px 30px" } },
          h(SectionLabel, null, "CORRECT SCORE GRID \u2014 ROWS ", homeName || "HOME", ", COLUMNS ", awayName || "AWAY"),
          h("div", { style: { overflowX: "auto", marginTop: 10 } },
            h("div", { style: { display: "inline-block" } },
              h("div", { style: { display: "flex" } },
                h("div", { style: { width: 28 } }),
                stats.grid[0].map(function (_, j) { return h("div", { key: j, style: { width: 44, textAlign: "center", fontSize: 11, color: TEAL } }, dispLabel(j)); })
              ),
              stats.grid.map(function (row, i) {
                return h("div", { style: { display: "flex" }, key: i },
                  h("div", { style: { width: 28, textAlign: "center", fontSize: 11, color: TEAL, alignSelf: "center" } }, dispLabel(i)),
                  row.map(function (p, j) {
                    const alpha = stats.maxCell ? p / stats.maxCell : 0;
                    const isBest = (i === stats.best.i && j === stats.best.j) || (i === 6 && stats.best.i >= 6 && j === stats.best.j) || (j === 6 && stats.best.j >= 6 && i === stats.best.i);
                    return h("div", { key: j, className: "flip-cell", style: { width: 44, height: 38, margin: 1.5, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, background: "rgba(165, 51, 43, " + (0.05 + alpha * 0.4) + ")", border: "1px solid " + LINE, animationDelay: ((i * 7 + j) * 10) + "ms" } },
                      (p * 100).toFixed(1),
                      isBest && h("div", { className: "stamp-font", style: { position: "absolute", inset: -6, border: "2px solid " + STAMP, borderRadius: "50%", color: STAMP, transform: "rotate(-14deg)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, letterSpacing: "0.05em", pointerEvents: "none", opacity: 0.9 } }, "BEST")
                    );
                  })
                );
              })
            )
          ),
          h("div", { style: { marginTop: 14, fontSize: 13, color: "#5B5548" } }, "Most likely scoreline: ",
            h("span", { className: "stamp-font", style: { color: STAMP, fontSize: 18 } }, stats.best.i, " \u2013 ", stats.best.j),
            " (", pct(stats.best.p), ")")
        ),
        h("div", { className: "perf" }),
        h("div", { style: { padding: "20px 30px 26px" } },
          h(SectionLabel, null, "SIDE MARKETS"),
          h("div", { style: { display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10, marginTop: 10 } },
            h(SplitRow, { title: "OVER / UNDER 2.5 GOALS", leftLabel: "OVER", leftValue: stats.over25, rightLabel: "UNDER", rightValue: stats.under25, pct: pct }),
            h(SplitRow, { title: "BOTH TEAMS TO SCORE", leftLabel: "YES", leftValue: stats.bttsYes, rightLabel: "NO", rightValue: stats.bttsNo, pct: pct })
          )
        )
      )
    )
  );
}

function SectionLabel(props) {
  return h("div", { style: { fontSize: 11, letterSpacing: "0.2em", color: TEAL, borderBottom: "1px dashed " + LINE, paddingBottom: 6 } }, props.children);
}

function NumberDial(props) {
  const label = props.label, value = props.value, setValue = props.setValue, align = props.align;
  return h("div", { style: { marginTop: 10 } },
    h("div", { style: { fontSize: 9.5, letterSpacing: "0.1em", color: "#8A8168", marginBottom: 4 } }, label),
    h("div", { style: { display: "flex", alignItems: "center", justifyContent: align === "right" ? "flex-end" : "flex-start", gap: 5 } },
      h("button", { className: "xg-btn btn-punch", onClick: function () { setValue(Math.max(0, +(value - 0.1).toFixed(1))); }, style: { width: 20, height: 20, border: "1px solid " + INK, background: "transparent", color: INK, fontSize: 12 } }, "\u2212"),
      h("div", { className: "stamp-font", style: { fontSize: 17, minWidth: 36, textAlign: "center" } }, value.toFixed(1)),
      h("button", { className: "xg-btn btn-punch", onClick: function () { setValue(Math.min(6, +(value + 0.1).toFixed(1))); }, style: { width: 20, height: 20, border: "1px solid " + INK, background: "transparent", color: INK, fontSize: 12 } }, "+")
    )
  );
}

function TeamField(props) {
  const align = props.align || "left";
  const fs = props.fetchState;
  return h("div", { style: { textAlign: align } },
    h("div", { style: { fontSize: 10.5, letterSpacing: "0.15em", color: TEAL, marginBottom: 6 } }, props.label),
    h("input", { className: "stamp-font", value: props.name, maxLength: 24, onChange: function (e) { props.setName(e.target.value.toUpperCase()); }, style: { width: "100%", background: "transparent", border: "none", borderBottom: "1px dashed " + LINE, color: INK, fontSize: 20, padding: "2px 0 6px", textAlign: align } }),
    h("button", { onClick: props.onFetch, disabled: fs && fs.loading, className: "fetch-btn", style: { marginTop: 8, fontSize: 10, letterSpacing: "0.08em", color: TEAL, background: "transparent", border: "1px dashed " + TEAL, borderRadius: 3, padding: "5px 10px" } }, fs && fs.loading ? "FETCHING\u2026" : "\u27F3 PULL REAL STATS"),
    fs && fs.note && h("div", { style: { fontSize: 9.5, color: TEAL, marginTop: 4 } }, fs.note),
    fs && fs.error && h("div", { style: { fontSize: 9.5, color: STAMP, marginTop: 4 } }, fs.error),
    h(NumberDial, { label: "SCORED / GAME", value: props.scored, setValue: props.setScored, align: align }),
    h(NumberDial, { label: "CONCEDED / GAME", value: props.conceded, setValue: props.setConceded, align: align })
  );
}

function ResultCell(props) {
  const isMax = props.isMax;
  return h("div", { className: "flip-cell", style: { animationDelay: props.delay + "ms", border: "1px solid " + (isMax ? STAMP : LINE), background: isMax ? "rgba(165,51,43,0.08)" : "transparent", padding: "12px 8px", textAlign: "center" } },
    h("div", { style: { fontSize: 10.5, letterSpacing: "0.1em", color: isMax ? STAMP : "#8A8168", marginBottom: 6 } }, props.label),
    h("div", { className: "stamp-font", style: { fontSize: 24, color: isMax ? STAMP : INK } }, props.pct(props.value))
  );
}

function SplitRow(props) {
  return h("div", { style: { border: "1px solid " + LINE, padding: "12px 16px" } },
    h("div", { style: { fontSize: 10, letterSpacing: "0.1em", color: "#8A8168", marginBottom: 8 } }, props.title),
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline" } },
      h("div", null,
        h("div", { className: "stamp-font", style: { fontSize: 20, color: STAMP } }, props.pct(props.leftValue)),
        h("div", { style: { fontSize: 9.5, color: "#8A8168" } }, props.leftLabel)
      ),
      h("div", { style: { textAlign: "right" } },
        h("div", { className: "stamp-font", style: { fontSize: 20, color: TEAL } }, props.pct(props.rightValue)),
        h("div", { style: { fontSize: 9.5, color: "#8A8168" } }, props.rightLabel)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(CouponPredictor));
</script>
</body>
</html>
